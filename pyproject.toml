[project]
name = "doc-routing-agent-poc"
version = "0.1.0"
description = "사내 수신 문서 분류·라우팅 에이전트 PoC"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "eval"]
